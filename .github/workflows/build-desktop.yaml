name: build-desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-linux:
    name: build-linux-nix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Show Nix version
        run: nix --version

      - name: Build desktop app in Nix dev shell
        run: nix develop --command task build:desktop
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.run_id }}

      - name: Collect Linux assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-assets
          mkdir -p release-assets

          if [ -d "src-tauri/target/release/bundle" ]; then
            find src-tauri/target/release/bundle -type f \
              \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.tar.gz" \) \
              -exec cp {} release-assets/ \;
          fi

          if [ -f "src-tauri/target/release/fyom" ] && [ -z "$(ls -A release-assets 2>/dev/null || true)" ]; then
            cp src-tauri/target/release/fyom release-assets/
          fi

          echo "Collected Linux assets:"
          ls -lah release-assets || true

          if [ -z "$(ls -A release-assets 2>/dev/null || true)" ]; then
            echo "No Linux release assets found"
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build-macos-native
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Install Tauri CLI to deterministic path
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-cli --version '^2' --locked --root "$RUNNER_TEMP/tauri-cli"
          echo "$RUNNER_TEMP/tauri-cli/bin" >> "$GITHUB_PATH"

      - name: Verify Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          which cargo-tauri
          cargo-tauri --version

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build desktop app on macOS runner
        run: task build:desktop
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.run_id }}

      - name: Collect macOS assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-assets
          mkdir -p release-assets

          if [ -d "src-tauri/target/release/bundle" ]; then
            find src-tauri/target/release/bundle -type f \
              \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.tar.gz" -o -name "*.sig" \) \
              -exec cp {} release-assets/ \;
          fi

          if [ -f "src-tauri/target/release/fyom" ] && [ -z "$(ls -A release-assets 2>/dev/null || true)" ]; then
            cp src-tauri/target/release/fyom release-assets/
          fi

          echo "Collected macOS assets:"
          ls -lah release-assets || true

          if [ -z "$(ls -A release-assets 2>/dev/null || true)" ]; then
            echo "No macOS release assets found"
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build-windows-native
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Install Tauri CLI to deterministic path
        shell: pwsh
        run: |
          cargo install tauri-cli --version '^2' --locked --root "$env:RUNNER_TEMP\tauri-cli"
          "$env:RUNNER_TEMP\tauri-cli\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Tauri CLI
        shell: pwsh
        run: |
          Get-Command cargo-tauri
          cargo-tauri --version

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build desktop app on Windows runner
        shell: pwsh
        run: task build:desktop
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.run_id }}

      - name: Collect Windows assets
        shell: pwsh
        run: |
          if (Test-Path "release-assets") {
            Remove-Item -Recurse -Force "release-assets"
          }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $bundleFiles = @()

          if (Test-Path "src-tauri/target/release/bundle") {
            $bundleFiles = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in ".msi", ".exe"
              }
          }

          if ($bundleFiles.Count -gt 0) {
            $bundleFiles | Copy-Item -Destination release-assets
            Write-Host "Collected bundled Windows artifacts."
          }
          elseif (Test-Path "src-tauri/target/release/fyom.exe") {
            Copy-Item "src-tauri/target/release/fyom.exe" -Destination release-assets
            Write-Host "No installer bundle found; collected raw fyom.exe as fallback artifact."
          }
          else {
            Write-Error "No Windows desktop artifact found."
            exit 1
          }

          Write-Host "Collected Windows assets:"
          Get-ChildItem release-assets

          if (-not (Get-ChildItem release-assets -File -ErrorAction SilentlyContinue)) {
            Write-Error "No Windows release assets found after collection."
            exit 1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: create-github-release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf staged
          mkdir -p staged

          if [ ! -d "downloaded-artifacts" ]; then
            echo "downloaded-artifacts directory does not exist"
            exit 1
          fi

          echo "Downloaded artifacts:"
          find downloaded-artifacts -type f -maxdepth 3 -print | sort || true

          while IFS= read -r -d '' file; do
            base_name="$(basename "$file")"
            parent_name="$(basename "$(dirname "$file")")"
            destination="staged/$base_name"

            if [ -e "$destination" ]; then
              destination="staged/${parent_name}-${base_name}"
            fi

            cp "$file" "$destination"
          done < <(find downloaded-artifacts -type f -print0)

          echo "Staged release assets:"
          ls -lah staged || true

          if [ -z "$(ls -A staged 2>/dev/null || true)" ]; then
            echo "No staged release assets found"
            exit 1
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$TAG_NAME" ]; then
            echo "TAG_NAME is empty"
            exit 1
          fi

          if [ -z "$(ls -A staged 2>/dev/null || true)" ]; then
            echo "No files found in staged/"
            exit 1
          fi

          echo "Preparing release for tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release already exists. Uploading assets with clobber enabled."

            if [[ "$TAG_NAME" == *-* ]]; then
              gh release edit "$TAG_NAME" --prerelease
            fi

            gh release upload "$TAG_NAME" staged/* --clobber
          else
            echo "Release does not exist. Creating a new release."

            create_args=(
              release create "$TAG_NAME"
              staged/*
              --title "$TAG_NAME"
              --generate-notes
            )

            if [[ "$TAG_NAME" == *-* ]]; then
              create_args+=(--prerelease)
            fi

            gh "${create_args[@]}"
          fi

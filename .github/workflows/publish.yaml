name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Prerelease"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Linux: Nix flake build
  # Produces:
  # - deb
  # - rpm
  # - tar.gz
  # ============================================================
  build-linux:
    name: build linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show Nix environment
        shell: bash
        run: |
          nix --version
          nix develop --command bash -lc 'node --version'
          nix develop --command bash -lc 'pnpm --version'
          nix develop --command bash -lc 'rustc --version'
          nix develop --command bash -lc 'cargo --version'
          nix develop --command bash -lc 'go version'
          nix develop --command bash -lc 'task --version'

      - name: Install frontend dependencies
        shell: bash
        run: |
          nix develop --command bash -lc '
            set -euo pipefail

            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            elif [ -f web/pnpm-lock.yaml ]; then
              cd web
              pnpm install --frozen-lockfile
            elif [ -f package-lock.json ]; then
              npm ci
            elif [ -f web/package-lock.json ]; then
              cd web
              npm ci
            else
              echo "No known frontend lockfile found"
              exit 1
            fi
          '

      - name: Build Linux desktop bundles
        shell: bash
        run: |
          nix develop --command task build:desktop

      - name: Build Linux tar.gz
        shell: bash
        run: |
          nix develop --command task build:tarball

      - name: Collect Linux release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          cp src-tauri/target/release/bundle/rpm/*.rpm release-assets/
          cp release/*.tar.gz release-assets/

          echo "Collected Linux assets:"
          ls -lah release-assets

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets/*
          if-no-files-found: error

  # ============================================================
  # macOS: Nix flake build
  #
  # flake.nix is intentionally left unchanged for this iteration.
  # If macOS fails due to Linux-only Nix packages, fix flake.nix
  # in the next pass.
  # ============================================================
  build-macos:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
          - os: macos-13
            platform: macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show Nix environment
        shell: bash
        run: |
          nix --version
          nix develop --command bash -lc 'node --version'
          nix develop --command bash -lc 'pnpm --version'
          nix develop --command bash -lc 'rustc --version'
          nix develop --command bash -lc 'cargo --version'
          nix develop --command bash -lc 'go version'
          nix develop --command bash -lc 'task --version'

      - name: Install frontend dependencies
        shell: bash
        run: |
          nix develop --command bash -lc '
            set -euo pipefail

            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            elif [ -f web/pnpm-lock.yaml ]; then
              cd web
              pnpm install --frozen-lockfile
            elif [ -f package-lock.json ]; then
              npm ci
            elif [ -f web/package-lock.json ]; then
              cd web
              npm ci
            else
              echo "No known frontend lockfile found"
              exit 1
            fi
          '

      - name: Build macOS desktop bundle
        shell: bash
        run: |
          nix develop --command task build:desktop

      - name: Collect macOS release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          find src-tauri/target/release/bundle \
            -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" \) \
            -exec cp {} release-assets/ \;

          echo "Collected macOS assets:"
          ls -lah release-assets

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  # ============================================================
  # Windows: native build
  #
  # Native Windows runner cannot use Determinate Nix installer.
  # Windows is intentionally built without nix develop.
  # ============================================================
  build-windows:
    name: build windows
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Task
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          cargo install tauri-cli --locked

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path "pnpm-lock.yaml") {
            pnpm install --frozen-lockfile
          } elseif (Test-Path "web/pnpm-lock.yaml") {
            Push-Location web
            pnpm install --frozen-lockfile
            Pop-Location
          } elseif (Test-Path "package-lock.json") {
            npm ci
          } elseif (Test-Path "web/package-lock.json") {
            Push-Location web
            npm ci
            Pop-Location
          } else {
            Write-Error "No known frontend lockfile found"
          }

      - name: Build Windows desktop bundle
        shell: bash
        run: |
          task build:desktop

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object {
              $_.Extension -in ".msi", ".exe"
            } |
            Copy-Item -Destination release-assets

          Write-Host "Collected Windows assets:"
          Get-ChildItem release-assets

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets/*
          if-no-files-found: error

  # ============================================================
  # Publish GitHub Release
  #
  # Tag release logic is intentionally preserved:
  # - push tag v* publishes release
  # - workflow_dispatch supports prerelease input
  # ============================================================
  publish-release:
    name: publish release
    runs-on: ubuntu-24.04

    needs:
      - build-linux
      - build-macos
      - build-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          find release-assets -type f -maxdepth 2 -print
          ls -lah release-assets

      # ==========================================
      # Determine prerelease
      # Keep release/tag behavior unchanged.
      # ==========================================
      - name: Determine prerelease
        id: prerelease
        shell: bash
        run: |
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "value=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" =~ -(rc|beta|alpha)\. ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

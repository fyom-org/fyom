version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - sqlclosecheck
    - errorlint
    - nilerr
    - prealloc
    - unconvert
    - unparam

  disable:
    - gocyclo
    - funlen
    - gocognit

  exclusions:
    paths:
      - vendor/
      - third_party/
      - examples?$
      - ^pkg/generated/
      - \.pb\.go$
      - /mocks/
      - build
      - tmp
      - frontend/node_modules
      - frontend/dist

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

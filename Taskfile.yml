version: "3"

vars:
  BINARY_NAME: fyom
  BUILD_DIR: ./build
  CMD_PATH: ./cmd/fyom

tasks:
  default:
    desc: "List all task commands"
    cmds:
      - task -a

  # ================================================
  # Development
  # ================================================

  dev:
    desc: "Run Go backend with Air hot-reload (backend pane)"
    cmds:
      - air -c .air.toml

  dev:web:
    desc: "Run Vite dev server (frontend pane)"
    dir: web
    cmds:
      - npm run dev -- --host

  # ================================================
  # Preview Developmet (Allow any host)
  # ================================================

  preview:
    desc: "Run Go backend with Air hot-reload (backend pane)"
    cmds:
      - CGO_ENABLED=0 FYOM_SERVER_HOST=127.0.0.1 go run cmd/fyom/main.go -c

  preview:web:
    desc: "Run Vite dev server (frontend pane)"
    dir: web
    cmds:
      - npm run preview

  # ================================================
  # Build
  # ================================================

  build:web:
    desc: "Build frontend for production"
    dir: web
    cmds:
      - npm run build:full
      - find dist -name "*.map" -delete

  build:
    desc: "Build single binary (embedded frontend)"
    deps: [build:web]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 go build -ldflags "-s -w" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.CMD_PATH}}

  # ================================================
  # Quality
  # ================================================

  test:
    desc: "Run all Go tests"
    cmds:
      - go test -v -count=1 ./...
    env:
      CGO_ENABLED: "0"

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...
    env:
      CGO_ENABLED: "0"

  # ================================================
  # Cleanup
  # ================================================

  clean:
    desc: "Remove build artifacts and temp files"
    cmds:
      - rm -rf {{.BUILD_DIR}} web/dist tmp/ data/ coverage.out

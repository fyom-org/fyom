version: "3"

vars:
  BINARY_NAME: fyom
  BUILD_DIR: ./build
  CMD_PATH: ./cmd/fyom

tasks:
  default:
    desc: "List all task commands"
    cmds:
      - task -a

  # ================================================
  # Development
  # ================================================

  dev:
    desc: "Run Go backend with Air hot-reload"
    cmds:
      - air -c .air.toml

  dev:web:
    desc: "Run Vite dev server"
    dir: web
    cmds:
      - npm run dev -- --host

  # ================================================
  # Preview
  # ================================================

  preview:
    desc: "Run Go backend preview"
    cmds:
      - CGO_ENABLED=0 FYOM_SERVER_HOST=127.0.0.1 go run cmd/fyom/main.go -c

  preview:web:
    desc: "Run Vite preview server"
    dir: web
    cmds:
      - npm run preview

  # ================================================
  # Build
  # ================================================

  build:web:
    desc: "Build frontend for production"
    dir: web
    cmds:
      - npm run build:full
      - find dist -name "*.map" -delete

  build:
    desc: "Build fyom backend binary with embedded frontend"
    deps: [build:web]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/fyom/fyom/internal/version.Version={{.VERSION}} -X github.com/fyom/fyom/internal/version.Commit={{.COMMIT}} -X github.com/fyom/fyom/internal/version.BuildTime={{.BUILD_TIME}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.CMD_PATH}}

  sidecar:
    desc: "Build fyom sidecar binary"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/fyom/fyom/internal/version.Version={{.VERSION}} -X github.com/fyom/fyom/internal/version.Commit={{.COMMIT}} -X github.com/fyom/fyom/internal/version.BuildTime={{.BUILD_TIME}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.CMD_PATH}}

  # ================================================
  # Desktop
  # ================================================

  dev:desktop:
    desc: "Run Tauri desktop dev mode (requires sidecar binary)"
    cmds:
      - task sidecar
      - cd src-tauri && cargo tauri dev

  build:desktop:
    desc: "Build Tauri desktop app bundle"
    deps: [build:web, sidecar]
    cmds:
      - cd src-tauri && cargo tauri build

  # ================================================
  # Test
  # ================================================

  test:
    desc: "Run all Go tests"
    cmds:
      - go test -v -count=1 ./...
    env:
      CGO_ENABLED: "0"

  test:race:
    desc: "Run Go race tests"
    cmds:
      - go test -race -count=1 ./...
    env:
      CGO_ENABLED: "1"

  coverage:
    desc: "Run Go coverage"
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
    env:
      CGO_ENABLED: "0"

  smoke:
    desc: "Run production smoke test"
    cmds:
      - bash scripts/smoke_test.sh

  verify:
    desc: "Verify build artifacts"
    cmds:
      - bash scripts/verify_bundle.sh

  # ================================================
  # Lint
  # ================================================

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...
    env:
      CGO_ENABLED: "0"

  # ================================================
  # CI
  # ================================================

  ci:
    desc: "Run CI verification suite"
    deps:
      - lint
      - test
      - build
      - verify

  # ================================================
  # Cleanup
  # ================================================

  clean:
    desc: "Remove build artifacts and temp files"
    cmds:
      - rm -rf {{.BUILD_DIR}} web/dist tmp/ data/ coverage.out coverage.html

version: "3"

vars:
  BINARY_NAME: fyom
  BUILD_DIR: ./build
  CMD_PATH: ./cmd/fyom

  VERSION: '{{default "dev" .VERSION}}'
  COMMIT: '{{default "unknown" .COMMIT}}'
  BUILD_TIME: '{{default "unknown" .BUILD_TIME}}'

  LD_FLAGS: >-
    -s -w
    -X github.com/fyom/fyom/internal/version.Version={{.VERSION}}
    -X github.com/fyom/fyom/internal/version.Commit={{.COMMIT}}
    -X github.com/fyom/fyom/internal/version.BuildTime={{.BUILD_TIME}}

  CLEAN_PATHS: >-
    {{.BUILD_DIR}}
    web/dist
    tmp/
    data/
    coverage.out
    coverage.html

tasks:
  default:
    desc: "List all task commands"
    cmds:
      - task -a

  # ================================================
  # Internal helpers
  # ================================================

  _build:binary:
    internal: true
    cmds:
      - mkdir -p "{{.BUILD_DIR}}"
      - >
        go build
        -ldflags "{{.LD_FLAGS}}"
        -o "{{.BUILD_DIR}}/{{.BINARY_NAME}}"
        "{{.CMD_PATH}}"
    env:
      CGO_ENABLED: "0"

  _go:packages:
    internal: true
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        mode="{{.MODE}}"
        empty_message="{{.EMPTY_MESSAGE}}"
        packages_file=""

        cleanup() {
          if [ -n "$packages_file" ] && [ -f "$packages_file" ]; then
            rm -f "$packages_file"
          fi
        }

        trap cleanup EXIT

        load_go_packages() {
          packages_file="$(mktemp)"

          if ! go list ./... > "$packages_file"; then
            echo
            echo "go list ./... failed."
            echo "If the error mentions web/embed.go or go:embed, ensure web/dist exists."
            echo "Try: task build:web:dist"
            exit 1
          fi

          mapfile -t packages < "$packages_file"

          filtered=()
          for package in "${packages[@]}"; do
            case "$package" in
              *web/node_modules*)
                continue
                ;;
            esac

            filtered+=("$package")
          done

          if [ "${#filtered[@]}" -eq 0 ]; then
            echo "$empty_message"
            exit 1
          fi
        }

        run_go_tests() {
          go test -v -count=1 "${filtered[@]}"
        }

        run_go_race_tests() {
          go test -race -count=1 "${filtered[@]}"
        }

        run_go_coverage() {
          go test -coverprofile=coverage.out "${filtered[@]}"
          go tool cover -func=coverage.out
        }

        run_go_lint() {
          local module_path
          local relative_path

          module_path="$(go list -m)"

          patterns=()
          for package in "${filtered[@]}"; do
            if [ "$package" = "$module_path" ]; then
              patterns+=(".")
              continue
            fi

            case "$package" in
              "$module_path"/*)
                relative_path="${package#"$module_path"/}"
                patterns+=("./$relative_path")
                ;;
              *)
                echo "Skipping non-module Go package: $package"
                ;;
            esac
          done

          if [ "${#patterns[@]}" -eq 0 ]; then
            echo "No Go packages found to lint."
            exit 1
          fi

          golangci-lint run "${patterns[@]}"
        }

        load_go_packages

        case "$mode" in
          test)
            run_go_tests
            ;;

          race)
            run_go_race_tests
            ;;

          coverage)
            run_go_coverage
            ;;

          lint)
            run_go_lint
            ;;

          *)
            echo "Unknown Go package mode: $mode"
            exit 1
            ;;
        esac
        EOF
    env:
      CGO_ENABLED: "{{.CGO_ENABLED}}"

  _test:playwright:run:
    internal: true
    desc: "Run Playwright-related command with shared environment"
    dir: web
    cmds:
      - "{{.PLAYWRIGHT_CMD}}"
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"
      NO_PROXY: "localhost,127.0.0.1,::1"
      no_proxy: "localhost,127.0.0.1,::1"

  # ================================================
  # Build
  # ================================================

  build:
    desc: "Build fyom backend binary with embedded frontend"
    deps:
      - build:web:dist
    cmds:
      - task: _build:binary

  build:web:
    desc: "Build frontend for production"
    deps:
      - build:web:install
    dir: web
    cmds:
      - pnpm run build:full
      - node ../scripts/delete-sourcemaps.js dist

  # ================================================
  # Web dependencies and embedded frontend assets
  # ================================================

  build:web:install:
    desc: "Install frontend dependencies"
    dir: web
    cmds:
      - pnpm install --frozen-lockfile

  build:web:dist:
    desc: "Ensure compiled frontend dist exists for Go embed"
    deps:
      - build:web:install
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        if [ -f "web/dist/index.html" ]; then
          echo "web/dist already exists."
          exit 0
        fi

        echo "web/dist is missing; building frontend for Go embed."
        task build:web
        EOF

  build:sidecar:
    desc: "Build fyom sidecar binary"
    deps:
      - build:web:dist
    cmds:
      - task: _build:binary

  build:desktop:
    desc: "Build Tauri desktop app bundle"
    deps: [build:sidecar]
    cmds:
      - cd src-tauri && cargo-tauri build

  build:tarball:
    desc: "Build Linux tar.gz artifact"
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        binary="src-tauri/target/release/fyom"

        if [ ! -f "$binary" ]; then
          echo "Desktop binary not found: $binary"
          echo "Run: task build:desktop"
          exit 1
        fi

        rm -rf release/fyom-linux-x86_64
        mkdir -p release/fyom-linux-x86_64

        cp "$binary" release/fyom-linux-x86_64/
        tar -czf release/fyom-linux-x86_64.tar.gz -C release fyom-linux-x86_64
        EOF

  # ================================================
  # Development & Preview
  # ================================================

  dev:
    desc: "Run Go backend with embedded web assets and Air hot-reload"
    cmds:
      - air -c .air.toml

  dev:desktop:
    desc: "Run Tauri desktop dev mode with external mpv player"
    cmds:
      - task dev:desktop-mpv-system

  dev:desktop-mpv-system:
    desc: "Run Tauri desktop dev mode using mpv from PATH"
    deps: [build:sidecar]
    dir: src-tauri
    env:
      FYOM_BIN: ../build/fyom
      FYOM_MPV_BIN: mpv
      FYOM_DESKTOP_CONFIG: "{{.ROOT_DIR}}/configs/fyom-desktop.json"
      RUST_LOG: debug
    cmds:
      - cargo-tauri dev

  dev:desktop-system-player:
    desc: "Run Tauri desktop dev mode using the OS default external player"
    deps: [build:sidecar]
    dir: src-tauri
    env:
      FYOM_BIN: ../build/fyom
      RUST_LOG: debug
    cmds:
      - cargo-tauri dev

  dev:web:
    desc: "Run Vite dev server"
    dir: web
    cmds:
      - pnpm run dev -- --host

  preview:
    desc: "Run Go backend preview"
    cmds:
      - CGO_ENABLED=0 go run cmd/fyom/main.go --db-path ./build/fyom.db

  preview:web:
    desc: "Run Vite preview server"
    dir: web
    cmds:
      - pnpm run preview

  # ================================================
  # Lint
  # ================================================

  lint:
    desc: "Run all linters"
    cmds:
      - task lint:go:config
      - task lint:all

  lint:all:
    desc: "Run language linters"
    deps:
      - lint:go
      - lint:web
      - lint:rust

  lint:go:
    desc: "Run Go linter for project packages"
    deps:
      - build:web:dist
    cmds:
      - task: _go:packages
        vars:
          MODE: lint
          EMPTY_MESSAGE: "No Go packages found to lint."
          CGO_ENABLED: "0"

  lint:go:config:
    desc: "Verify golangci-lint configuration"
    cmds:
      - golangci-lint config verify

  lint:rust:
    desc: "Run Rust formatter and clippy"
    dir: src-tauri
    cmds:
      - cargo fmt -- --check
      - cargo clippy --all-targets --all-features -- -D warnings

  lint:web:
    desc: "Run ESLint for web"
    dir: web
    cmds:
      - pnpm lint

  lint:web:fix:
    desc: "Run ESLint auto-fix for web"
    dir: web
    cmds:
      - pnpm lint:fix

  lint:web:trace:
    desc: "Run ESLint with Node deprecation trace"
    dir: web
    cmds:
      - pnpm lint
    env:
      NODE_OPTIONS: "--trace-deprecation"

  # ================================================
  # Test
  # ================================================

  test:
    desc: "Run all tests for backend, web frontend and tauri shell"
    deps:
      - test:go
      - test:web
      - test:rust

  test:coverage:
    desc: "Run Go coverage for project packages"
    deps:
      - build:web:dist
    cmds:
      - task: _go:packages
        vars:
          MODE: coverage
          EMPTY_MESSAGE: "No Go packages found for coverage."
          CGO_ENABLED: "0"

  test:go:
    desc: "Run all Go tests for project packages"
    deps:
      - build:web:dist
    cmds:
      - task: _go:packages
        vars:
          MODE: test
          EMPTY_MESSAGE: "No Go packages found to test."
          CGO_ENABLED: "0"

  test:playwright:
    desc: "Run frontend Vitest Browser Mode tests with Playwright"
    cmds:
      - task: _test:playwright:run
        vars:
          PLAYWRIGHT_CMD: pnpm exec vitest run --config vitest.browser.config.ts

  test:playwright-e2e:
    desc: "Run Playwright E2E tests"
    cmds:
      - task: _test:playwright:run
        vars:
          PLAYWRIGHT_CMD: pnpm exec playwright test

  test:playwright-headless:
    desc: "Run frontend Vitest Browser Mode tests with Playwright"
    cmds:
      - task: _test:playwright:run
        vars:
          PLAYWRIGHT_CMD: pnpm exec vitest run --browser.headless --reporter=verbose

  test:race:
    desc: "Run Go race tests for project packages"
    deps:
      - build:web:dist
    cmds:
      - task: _go:packages
        vars:
          MODE: race
          EMPTY_MESSAGE: "No Go packages found to test."
          CGO_ENABLED: "1"

  test:rust:
    desc: "Run Rust check and tests"
    dir: src-tauri
    cmds:
      - cargo check --all-targets --all-features
      - cargo test --all-features

  test:smoke:
    desc: "Run production smoke test"
    cmds:
      - bash scripts/smoke_test.sh

  test:web:
    desc: "Run web tests"
    dir: web
    cmds:
      - pnpm run test

  # ================================================
  # CI
  # ================================================

  ci:
    desc: "Run CI quality then build"
    cmds:
      - task ci:quality
      - task ci:build
      - task ci:build:desktop

  ci:build:
    desc: "Run CI build suite"
    cmds:
      - task build
      - task build:desktop
      - task build:tarball

  ci:build:desktop:
    desc: "Run CI verification suite"
    deps:
      - build:desktop

  ci:quality:
    desc: "Run CI quality gates without producing release artifacts"
    deps:
      - lint
      - test

  # ================================================
  # Cleanup
  # ================================================

  clean:
    desc: "Remove build artifacts and temp files"
    cmds:
      - rm -rf {{.CLEAN_PATHS}}

version: "3"

vars:
  BINARY_NAME: fyom
  BUILD_DIR: ./build
  CMD_PATH: ./cmd/fyom

  VERSION: '{{default "dev" .VERSION}}'
  COMMIT: '{{default "unknown" .COMMIT}}'
  BUILD_TIME: '{{default "unknown" .BUILD_TIME}}'

tasks:
  default:
    desc: "List all task commands"
    cmds:
      - task -a

  # ================================================
  # Development
  # ================================================

  dev:
    desc: "Run Go backend with Air hot-reload"
    cmds:
      - air -c .air.toml

  dev:web:
    desc: "Run Vite dev server"
    dir: web
    cmds:
      - pnpm run dev -- --host

  # ================================================
  # Preview
  # ================================================

  preview:
    desc: "Run Go backend preview"
    cmds:
      - CGO_ENABLED=0 go run cmd/fyom/main.go --db-path ./build/fyom.db

  preview:web:
    desc: "Run Vite preview server"
    dir: web
    cmds:
      - pnpm run preview

  # ================================================
  # Build
  # ================================================

  build:web:
    desc: "Build frontend for production"
    dir: web
    cmds:
      - pnpm run build:full
      - node ../scripts/delete-sourcemaps.js dist

  build:
    desc: "Build fyom backend binary with embedded frontend"
    deps: [build:web]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >
        CGO_ENABLED=0 go build
        -ldflags "-s -w
        -X github.com/fyom/fyom/internal/version.Version={{.VERSION}}
        -X github.com/fyom/fyom/internal/version.Commit={{.COMMIT}}
        -X github.com/fyom/fyom/internal/version.BuildTime={{.BUILD_TIME}}"
        -o {{.BUILD_DIR}}/{{.BINARY_NAME}}
        {{.CMD_PATH}}

  sidecar:
    desc: "Build fyom sidecar binary"
    deps: [build:web]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >
        CGO_ENABLED=0 go build
        -ldflags "-s -w
        -X github.com/fyom/fyom/internal/version.Version={{.VERSION}}
        -X github.com/fyom/fyom/internal/version.Commit={{.COMMIT}}
        -X github.com/fyom/fyom/internal/version.BuildTime={{.BUILD_TIME}}"
        -o {{.BUILD_DIR}}/{{.BINARY_NAME}}
        {{.CMD_PATH}}

  # ================================================
  # Desktop
  # ================================================

  setup:runtime-libs:
    desc: "Fetch libmpv runtime libs from fyom-org/fork-mpv into src-tauri/libs/mpv/"
    cmds:
      - node scripts/setup_runtime_libs.mjs

  sync:runtime-libs:
    desc: "Regenerate src-tauri/libs/runtime-libs.{platform}.json manifests from libs/mpv/"
    cmds:
      - node scripts/sync_runtime_libs.mjs

  bundle:runtime-libs:macos:
    desc: "Bundle libmpv + deps into the macOS .app Frameworks dir (sign-identity stub for Phase 3)"
    cmds:
      - bash scripts/bundle_runtime_libs_macos.sh src-tauri/target/release/bundle/macos/fyom.app {{.CLI_ARGS}}

  bundle:runtime-libs:linux:
    desc: "Bundle libmpv into Linux deb/AppImage bundle dirs"
    cmds:
      - node scripts/bundle_runtime_libs_linux.mjs --profile release

  bundle:runtime-libs:windows:
    desc: "Bundle libmpv DLLs next to the Windows .exe payload"
    cmds:
      - node scripts/bundle_runtime_libs_windows.mjs --profile release

  bundle:runtime-libs:
    desc: "Bundle libmpv runtime libs into the just-built desktop bundle (platform-aware)"
    cmds:
      - '{{if eq OS "darwin"}}task bundle:runtime-libs:macos{{else if eq OS "linux"}}task bundle:runtime-libs:linux{{else if eq OS "windows"}}task bundle:runtime-libs:windows{{end}}'

  dev:desktop:
    desc: "Run Tauri desktop dev mode (requires sidecar binary + setup:runtime-libs)"
    deps: [sidecar]
    env:
      FYOM_BIN: "{{.ROOT_DIR}}/build/fyom"
      FYOM_DESKTOP_MODE: dev
      FYOM_USE_BUNDLED_RUNTIME: "0"
    cmds:
      - node scripts/run_tauri.mjs dev

  dev:desktop-x11:
    desc: "Run Tauri desktop dev mode (requires sidecar binary + setup:runtime-libs)"
    deps: [sidecar]
    env:
      FYOM_BIN: "{{.ROOT_DIR}}/build/fyom"
      FYOM_DESKTOP_MODE: dev
      FYOM_USE_BUNDLED_RUNTIME: "0"
      GDK_BACKEND: "x11"
      FYOM_LINUX_VIDEO_BACKEND: "x11"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
    cmds:
      - node scripts/run_tauri.mjs dev

  dev:desktop-wayland:
    desc: "Run Tauri desktop dev mode (requires sidecar binary + setup:runtime-libs)"
    deps: [sidecar]
    env:
      FYOM_BIN: "{{.ROOT_DIR}}/build/fyom"
      FYOM_DESKTOP_MODE: dev
      FYOM_USE_BUNDLED_RUNTIME: "0"
      FYOM_LINUX_VIDEO_BACKEND: "wayland"
    cmds:
      - node scripts/run_tauri.mjs dev

  build:desktop:
    desc: "Build Tauri desktop app bundle (setup:runtime-libs → build → bundle:runtime-libs)"
    deps: [sidecar, setup:runtime-libs]
    env:
      FYOM_DESKTOP_MODE: build
      FYOM_USE_BUNDLED_RUNTIME: "1"
    cmds:
      - node scripts/run_tauri.mjs build
      - '{{if eq OS "darwin"}}task bundle:runtime-libs:macos{{else if eq OS "linux"}}task bundle:runtime-libs:linux{{else if eq OS "windows"}}task bundle:runtime-libs:windows{{end}}'

  build:tarball:
    desc: "Build Linux tar.gz artifact"
    cmds:
      - mkdir -p release/fyom-linux-x86_64
      - cp src-tauri/target/release/fyom release/fyom-linux-x86_64/
      - tar -czf release/fyom-linux-x86_64.tar.gz -C release fyom-linux-x86_64

  # ================================================
  # Test
  # ================================================

  test:
    desc: "Run all Go tests"
    cmds:
      - go test -v -count=1 ./...
    env:
      CGO_ENABLED: "0"

  test:playwright:
    desc: "Run frontend Vitest Browser Mode tests with Playwright"
    dir: web
    cmds:
      - pnpm exec vitest run --config vitest.browser.config.ts
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"
      NO_PROXY: "localhost,127.0.0.1,::1"
      no_proxy: "localhost,127.0.0.1,::1"

  test:playwright-e2e:
    desc: "Run Playwright E2E tests"
    dir: web
    cmds:
      - pnpm exec playwright test
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"
      NO_PROXY: "localhost,127.0.0.1,::1"
      no_proxy: "localhost,127.0.0.1,::1"

  test:playwright-headless:
    desc: "Run frontend Vitest Browser Mode tests with Playwright"
    dir: web
    cmds:
      - pnpm exec vitest run --browser.headless --reporter=verbose
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"
      NO_PROXY: "localhost,127.0.0.1,::1"
      no_proxy: "localhost,127.0.0.1,::1"

  test:race:
    desc: "Run Go race tests"
    cmds:
      - go test -race -count=1 ./...
    env:
      CGO_ENABLED: "1"

  coverage:
    desc: "Run Go coverage"
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
    env:
      CGO_ENABLED: "0"

  smoke:
    desc: "Run production smoke test"
    cmds:
      - bash scripts/smoke_test.sh

  verify:
    desc: "Verify build artifacts"
    cmds:
      - bash scripts/verify_bundle.sh

  # ================================================
  # Lint
  # ================================================

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...
    env:
      CGO_ENABLED: "0"

  # ================================================
  # CI
  # ================================================

  ci:
    desc: "Run CI verification suite"
    deps:
      - lint
      - test
      - build
      - verify

  # ================================================
  # Cleanup
  # ================================================

  clean:
    desc: "Remove build artifacts and temp files"
    cmds:
      - rm -rf {{.BUILD_DIR}} web/dist tmp/ data/ coverage.out coverage.html

version: "3"

vars:
  BINARY_NAME: fyom
  BUILD_DIR: ./build
  CMD_PATH: ./cmd/fyom

  VERSION: '{{default "dev" .VERSION}}'
  COMMIT: '{{default "unknown" .COMMIT}}'
  BUILD_TIME: '{{default "unknown" .BUILD_TIME}}'

tasks:
  default:
    desc: "List all task commands"
    cmds:
      - task -a

  # ================================================
  # Build
  # ================================================

  build:
    desc: "Build fyom backend binary with embedded frontend"
    deps: [build:web]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >
        CGO_ENABLED=0 go build
        -ldflags "-s -w
        -X github.com/fyom/fyom/internal/version.Version={{.VERSION}}
        -X github.com/fyom/fyom/internal/version.Commit={{.COMMIT}}
        -X github.com/fyom/fyom/internal/version.BuildTime={{.BUILD_TIME}}"
        -o {{.BUILD_DIR}}/{{.BINARY_NAME}}
        {{.CMD_PATH}}

  sidecar:
    desc: "Build fyom sidecar binary"
    deps: [build:web]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >
        CGO_ENABLED=0 go build
        -ldflags "-s -w
        -X github.com/fyom/fyom/internal/version.Version={{.VERSION}}
        -X github.com/fyom/fyom/internal/version.Commit={{.COMMIT}}
        -X github.com/fyom/fyom/internal/version.BuildTime={{.BUILD_TIME}}"
        -o {{.BUILD_DIR}}/{{.BINARY_NAME}}
        {{.CMD_PATH}}

  build:web:
    desc: "Build frontend for production"
    dir: web
    cmds:
      - pnpm run build:full
      - node ../scripts/delete-sourcemaps.js dist

  build:desktop:
    desc: "Build Tauri desktop app bundle"
    deps: [sidecar]
    cmds:
      - cd src-tauri && cargo-tauri build

  build:tarball:
    desc: "Build Linux tar.gz artifact"
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        binary="src-tauri/target/release/fyom"

        if [ ! -f "$binary" ]; then
          echo "Desktop binary not found: $binary"
          echo "Run: task build:desktop"
          exit 1
        fi

        rm -rf release/fyom-linux-x86_64
        mkdir -p release/fyom-linux-x86_64

        cp "$binary" release/fyom-linux-x86_64/
        tar -czf release/fyom-linux-x86_64.tar.gz -C release fyom-linux-x86_64
        EOF

  # ================================================
  # Development & Preview
  # ================================================

  dev:
    desc: "Run Go backend (with embed web) with Air hot-reload"
    cmds:
      - air -c .air.toml

  dev:desktop:
    desc: "Run Tauri desktop dev mode with external mpv player"
    env:
      FYOM_DESKTOP_CONFIG: "fyom/configs/fyom-desktop.json"
    cmds:
      - task dev:desktop-mpv-system

  dev:desktop-mpv-system:
    desc: "Run Tauri desktop dev mode using mpv from PATH"
    deps: [sidecar]
    dir: src-tauri
    env:
      FYOM_BIN: ../build/fyom
      FYOM_MPV_BIN: mpv
      RUST_LOG: debug
    cmds:
      - cargo-tauri dev

  dev:desktop-system-player:
    desc: "Run Tauri desktop dev mode using the OS default external player"
    deps: [sidecar]
    dir: src-tauri
    env:
      FYOM_BIN: ../build/fyom
      RUST_LOG: debug
    cmds:
      - cargo-tauri dev

  dev:web:
    desc: "Run Vite dev server"
    dir: web
    cmds:
      - pnpm run dev -- --host

  preview:
    desc: "Run Go backend preview"
    cmds:
      - CGO_ENABLED=0 go run cmd/fyom/main.go --db-path ./build/fyom.db

  preview:web:
    desc: "Run Vite preview server"
    dir: web
    cmds:
      - pnpm run preview

  # ================================================
  # Test
  # ================================================

  test:
    desc: "Run all tests for backend, web frontend and tauri shell"
    deps:
      - test:go
      - test:web
      - test:rust

  test:coverage:
    desc: "Run Go coverage for project packages"
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        mapfile -t packages < <(go list ./...)

        filtered=()
        for package in "${packages[@]}"; do
          case "$package" in
            *web/node_modules*)
              continue
              ;;
          esac

          filtered+=("$package")
        done

        if [ "${#filtered[@]}" -eq 0 ]; then
          echo "No Go packages found for coverage."
          exit 1
        fi

        go test -coverprofile=coverage.out "${filtered[@]}"
        go tool cover -func=coverage.out
        EOF
    env:
      CGO_ENABLED: "0"

  test:go:
    desc: "Run all Go tests for project packages"
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        mapfile -t packages < <(go list ./...)

        filtered=()
        for package in "${packages[@]}"; do
          case "$package" in
            *web/node_modules*)
              continue
              ;;
          esac

          filtered+=("$package")
        done

        if [ "${#filtered[@]}" -eq 0 ]; then
          echo "No Go packages found to test."
          exit 1
        fi

        go test -v -count=1 "${filtered[@]}"
        EOF
    env:
      CGO_ENABLED: "0"

  test:playwright:
    desc: "Run frontend Vitest Browser Mode tests with Playwright"
    dir: web
    cmds:
      - pnpm exec vitest run --config vitest.browser.config.ts
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"
      NO_PROXY: "localhost,127.0.0.1,::1"
      no_proxy: "localhost,127.0.0.1,::1"

  test:playwright-e2e:
    desc: "Run Playwright E2E tests"
    dir: web
    cmds:
      - pnpm exec playwright test
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"
      NO_PROXY: "localhost,127.0.0.1,::1"
      no_proxy: "localhost,127.0.0.1,::1"

  test:playwright-headless:
    desc: "Run frontend Vitest Browser Mode tests with Playwright"
    dir: web
    cmds:
      - pnpm exec vitest run --browser.headless --reporter=verbose
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"
      NO_PROXY: "localhost,127.0.0.1,::1"
      no_proxy: "localhost,127.0.0.1,::1"

  test:race:
    desc: "Run Go race tests for project packages"
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        mapfile -t packages < <(go list ./...)

        filtered=()
        for package in "${packages[@]}"; do
          case "$package" in
            *web/node_modules*)
              continue
              ;;
          esac

          filtered+=("$package")
        done

        if [ "${#filtered[@]}" -eq 0 ]; then
          echo "No Go packages found to test."
          exit 1
        fi

        go test -race -count=1 "${filtered[@]}"
        EOF
    env:
      CGO_ENABLED: "1"

  test:rust:
    desc: "Run Rust check and tests"
    dir: src-tauri
    cmds:
      - cargo check --all-targets --all-features
      - cargo test --all-features

  test:smoke:
    desc: "Run production smoke test"
    cmds:
      - bash scripts/smoke_test.sh

  test:web:
    desc: "Run web tests"
    dir: web
    cmds:
      - pnpm run test

  # ================================================
  # Lint
  # ================================================

  lint:
    desc: "Run all linters"
    cmds:
      - task lint:go:config
      - task lint:all

  lint:all:
    desc: "Run language linters"
    deps:
      - lint:go
      - lint:web
      - lint:rust

  lint:go:
    desc: "Run Go linter for project packages"
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        module_path="$(go list -m)"
        mapfile -t packages < <(go list ./...)

        patterns=()
        for package in "${packages[@]}"; do
          case "$package" in
            *web/node_modules*)
              continue
              ;;
          esac

          if [ "$package" = "$module_path" ]; then
            patterns+=(".")
            continue
          fi

          case "$package" in
            "$module_path"/*)
              relative_path="${package#"$module_path"/}"
              patterns+=("./$relative_path")
              ;;
            *)
              echo "Skipping non-module Go package: $package"
              ;;
          esac
        done

        if [ "${#patterns[@]}" -eq 0 ]; then
          echo "No Go packages found to lint."
          exit 1
        fi

        golangci-lint run "${patterns[@]}"
        EOF
    env:
      CGO_ENABLED: "0"

  lint:go:config:
    desc: "Verify golangci-lint configuration"
    cmds:
      - golangci-lint config verify

  lint:rust:
    desc: "Run Rust formatter and clippy"
    dir: src-tauri
    cmds:
      - cargo fmt -- --check
      - cargo clippy --all-targets --all-features -- -D warnings

  lint:web:
    desc: "Run ESLint for web"
    dir: web
    cmds:
      - pnpm lint

  lint:web:fix:
    desc: "Run ESLint auto-fix for web"
    dir: web
    cmds:
      - pnpm lint:fix

  lint:web:trace:
    desc: "Run ESLint with Node deprecation trace"
    dir: web
    cmds:
      - pnpm lint
    env:
      NODE_OPTIONS: "--trace-deprecation"

  # ================================================
  # CI
  # ================================================

  ci:
    desc: "Run CI quality then build"
    cmds:
      - task ci:quality
      - task ci:build
      - task ci:build:desktop

  ci:build:
    desc: "Run CI build suite"
    cmds:
      - task build
      - task build:desktop
      - task build:tarball

  ci:build:desktop:
    desc: "Run CI verification suite"
    deps:
      - build:desktop

  ci:quality:
    desc: "Run CI quality gates without producing release artifacts"
    deps:
      - lint
      - test

  # ================================================
  # Cleanup
  # ================================================

  clean:
    desc: "Remove build artifacts and temp files"
    cmds:
      - rm -rf {{.BUILD_DIR}} web/dist tmp/ data/ coverage.out coverage.html

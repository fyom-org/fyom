version: "3"

includes:
  common: ./build/Taskfile.yml

vars:
  APP_NAME: fyom
  BINARY_NAME: fyom
  BIN_DIR: dist
  BUILD_DIR: ./dist
  CMD_PATH: ./cmd/fyom
  PACKAGE_MANAGER: pnpm
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"

  VERSION: '{{default "dev" .VERSION}}'
  COMMIT: '{{default "unknown" .COMMIT}}'
  BUILD_TIME: '{{default "unknown" .BUILD_TIME}}'

  LD_FLAGS: >-
    -s -w
    -X github.com/fyom/fyom/internal/version.Version={{.VERSION}}
    -X github.com/fyom/fyom/internal/version.Commit={{.COMMIT}}
    -X github.com/fyom/fyom/internal/version.BuildTime={{.BUILD_TIME}}

  CLEAN_PATHS: >-
    {{.BUILD_DIR}}
    frontend/dist
    tmp/
    data/
    coverage.out
    coverage.html

tasks:
  default:
    desc: "List all task commands"
    cmds:
      - task -a

  # ================================================
  # Wails v3 entrypoints
  # ================================================

  build:
    desc: "Build Wails v3 desktop application for current OS"
    deps:
      - _ensure:wails3
    cmds:
      - task: "{{OS}}:build"
        vars:
          DEV: '{{default "false" .DEV}}'
          EXTRA_TAGS: '{{default "" .EXTRA_TAGS}}'
          BUILD_FLAGS: '{{default "" .BUILD_FLAGS}}'
          OBFUSCATED: '{{default "false" .OBFUSCATED}}'

  dev:
    desc: "Run Wails v3 desktop dev mode"
    deps:
      - _ensure:wails3
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  run:
    desc: "Run built desktop binary"
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}}

  package:
    desc: "Package application for current OS"
    deps:
      - build
    cmds:
      - task: "{{OS}}:package"

  build:desktop:
    desc: "Alias for Wails desktop build"
    cmds:
      - task: build

  dev:desktop:
    desc: "Alias for Wails desktop dev mode"
    cmds:
      - task: dev

  # ================================================
  # Linux Wails hook
  # ================================================

  linux:build:
    desc: "Wails v3 hook: build Linux desktop binary"
    deps:
      - task: common:build:frontend
        vars:
          DEV: '{{default "false" .DEV}}'
          PACKAGE_MANAGER: "{{.PACKAGE_MANAGER}}"
          BUILD_FLAGS: '{{default "" .BUILD_FLAGS}}'
          OBFUSCATED: '{{default "false" .OBFUSCATED}}'
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        mkdir -p "{{.BIN_DIR}}"

        args=()

        if [ -n "{{.EXTRA_TAGS}}" ]; then
          args+=(-tags "{{.EXTRA_TAGS}}")
          echo "Go build tags: {{.EXTRA_TAGS}}"
        fi

        if [ -n "{{.BUILD_FLAGS}}" ]; then
          # shellcheck disable=SC2206
          build_flags=( {{.BUILD_FLAGS}} )
          args+=("${build_flags[@]}")
        fi

        echo "Building Linux Wails desktop binary..."
        echo "  package: {{.CMD_PATH}}"
        echo "  output:  {{.BIN_DIR}}/{{.APP_NAME}}"

        CGO_ENABLED=1 go build \
          "${args[@]}" \
          -ldflags "{{.LD_FLAGS}}" \
          -o "{{.BIN_DIR}}/{{.APP_NAME}}" \
          "{{.CMD_PATH}}"

        echo "Linux desktop build complete:"
        echo "  {{.BIN_DIR}}/{{.APP_NAME}}"
        EOF

  linux:run:
    desc: "Run Linux desktop binary"
    deps:
      - linux:build
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}}

  linux:package:
    desc: "Create simple Linux tar.gz package"
    deps:
      - linux:build
    cmds:
      - task: build:tarball

  # ================================================
  # Internal helpers
  # ================================================

  _ensure:wails3:
    internal: true
    desc: "Ensure wails3 CLI is available"
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        if command -v wails3 >/dev/null 2>&1; then
          echo "wails3 found: $(command -v wails3)"
          wails3 --help >/dev/null
          exit 0
        fi

        if [ -x "$HOME/go/bin/wails3" ]; then
          export PATH="$HOME/go/bin:$PATH"
          echo "wails3 found: $(command -v wails3)"
          wails3 --help >/dev/null
          exit 0
        fi

        echo "wails3 CLI not found."
        echo
        echo "Install with one of:"
        echo "  nix develop"
        echo "  go install github.com/wailsapp/wails/v3/cmd/wails3@latest"
        echo
        exit 1
        EOF

  _build:backend:
    internal: true
    deps:
      - build:frontend:dist
    cmds:
      - mkdir -p "{{.BUILD_DIR}}"
      - >
        CGO_ENABLED=0 go build
        -ldflags "{{.LD_FLAGS}}"
        -o "{{.BUILD_DIR}}/{{.BINARY_NAME}}"
        "{{.CMD_PATH}}"

  _go:packages:
    internal: true
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        mode="{{.MODE}}"
        empty_message="{{.EMPTY_MESSAGE}}"
        packages_file=""

        cleanup() {
          if [ -n "$packages_file" ] && [ -f "$packages_file" ]; then
            rm -f "$packages_file"
          fi
        }

        trap cleanup EXIT

        load_go_packages() {
          packages_file="$(mktemp)"

          if ! go list ./... > "$packages_file"; then
            echo
            echo "go list ./... failed."
            echo "If the error mentions frontend/embed.go or go:embed, ensure frontend/dist exists."
            echo "Try: task build:frontend:dist"
            exit 1
          fi

          mapfile -t packages < "$packages_file"

          filtered=()
          for package in "${packages[@]}"; do
            case "$package" in
              *frontend/node_modules*)
                continue
                ;;
            esac
            filtered+=("$package")
          done

          if [ "${#filtered[@]}" -eq 0 ]; then
            echo "$empty_message"
            exit 1
          fi
        }

        run_go_tests() {
          go test -v -count=1 "${filtered[@]}"
        }

        run_go_race_tests() {
          go test -race -count=1 "${filtered[@]}"
        }

        run_go_coverage() {
          go test -coverprofile=coverage.out "${filtered[@]}"
          go tool cover -func=coverage.out
        }

        run_go_lint() {
          local module_path
          local relative_path

          module_path="$(go list -m)"

          patterns=()
          for package in "${filtered[@]}"; do
            if [ "$package" = "$module_path" ]; then
              patterns+=(".")
              continue
            fi

            case "$package" in
              "$module_path"/*)
                relative_path="${package#"$module_path"/}"
                patterns+=("./$relative_path")
                ;;
              *)
                echo "Skipping non-module Go package: $package"
                ;;
            esac
          done

          if [ "${#patterns[@]}" -eq 0 ]; then
            echo "No Go packages found to lint."
            exit 1
          fi

          golangci-lint run "${patterns[@]}"
        }

        load_go_packages

        case "$mode" in
          test)
            run_go_tests
            ;;
          race)
            run_go_race_tests
            ;;
          coverage)
            run_go_coverage
            ;;
          lint)
            run_go_lint
            ;;
          *)
            echo "Unknown Go package mode: $mode"
            exit 1
            ;;
        esac
        EOF
    env:
      CGO_ENABLED: "{{.CGO_ENABLED}}"

  _test:playwright:run:
    internal: true
    desc: "Run Playwright-related command with shared environment"
    dir: frontend
    cmds:
      - "{{.PLAYWRIGHT_CMD}}"
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"
      NO_PROXY: "localhost,127.0.0.1,::1"
      no_proxy: "localhost,127.0.0.1,::1"

  # ================================================
  # Backend / frontend build
  # ================================================

  build:backend:
    desc: "Build fyom backend binary with embedded frontend"
    cmds:
      - task: _build:backend

  build:frontend:
    desc: "Build frontend for production"
    deps:
      - build:frontend:install
    dir: frontend
    cmds:
      - pnpm run build:full
      - node ../scripts/delete-sourcemaps.js dist

  build:frontend:install:
    desc: "Install frontend dependencies"
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile

  build:frontend:dist:
    desc: "Ensure compiled frontend dist exists for Go embed"
    deps:
      - build:frontend:install
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        if [ -f "frontend/dist/index.html" ]; then
          echo "frontend/dist already exists."
          exit 0
        fi

        echo "frontend/dist is missing; building frontend for Go embed."
        task build:frontend
        EOF

  build:tarball:
    desc: "Build Linux tar.gz artifact"
    deps:
      - build:backend
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail

        binary="{{.BUILD_DIR}}/{{.BINARY_NAME}}"

        if [ ! -f "$binary" ]; then
          echo "Binary not found: $binary"
          echo "Run: task build:backend"
          exit 1
        fi

        rm -rf release/fyom-linux-x86_64
        mkdir -p release/fyom-linux-x86_64

        cp "$binary" release/fyom-linux-x86_64/
        tar -czf release/fyom-linux-x86_64.tar.gz -C release fyom-linux-x86_64

        echo "Created release/fyom-linux-x86_64.tar.gz"
        EOF

  # ================================================
  # Development and preview
  # ================================================

  dev:backend:
    desc: "Run Go backend with embedded frontend assets and Air hot-reload"
    cmds:
      - air -c .air.toml

  dev:frontend:
    desc: "Run Vite dev server"
    dir: frontend
    cmds:
      - pnpm run dev -- --host

  preview:
    desc: "Run Go backend preview"
    deps:
      - build:frontend:dist
    cmds:
      - CGO_ENABLED=0 go run cmd/fyom/main.go --db-path ./dist/fyom.db

  preview:frontend:
    desc: "Run Vite preview server"
    dir: frontend
    cmds:
      - pnpm run preview

  # ================================================
  # Lint
  # ================================================

  lint:
    desc: "Run all linters"
    cmds:
      - task lint:go:config
      - task lint:all

  lint:all:
    desc: "Run language linters"
    deps:
      - lint:go
      - lint:frontend

  lint:go:
    desc: "Run Go linter for project packages"
    deps:
      - build:frontend:dist
    cmds:
      - task: _go:packages
        vars:
          MODE: lint
          EMPTY_MESSAGE: "No Go packages found to lint."
          CGO_ENABLED: "0"

  lint:go:config:
    desc: "Verify golangci-lint configuration"
    cmds:
      - golangci-lint config verify

  lint:frontend:
    desc: "Run ESLint for frontend"
    dir: frontend
    cmds:
      - pnpm lint

  lint:frontend:fix:
    desc: "Run ESLint auto-fix"
    dir: frontend
    cmds:
      - pnpm lint:fix

  lint:frontend:trace:
    desc: "Run ESLint with Node deprecation trace"
    dir: frontend
    cmds:
      - pnpm lint
    env:
      NODE_OPTIONS: "--trace-deprecation"

  # ================================================
  # Test
  # ================================================

  test:
    desc: "Run all tests for backend and frontend frontend"
    deps:
      - test:go
      - test:frontend

  test:coverage:
    desc: "Run Go coverage for project packages"
    deps:
      - build:frontend:dist
    cmds:
      - task: _go:packages
        vars:
          MODE: coverage
          EMPTY_MESSAGE: "No Go packages found for coverage."
          CGO_ENABLED: "0"

  test:go:
    desc: "Run all Go tests for project packages"
    deps:
      - build:frontend:dist
    cmds:
      - task: _go:packages
        vars:
          MODE: test
          EMPTY_MESSAGE: "No Go packages found to test."
          CGO_ENABLED: "0"

  test:playwright:
    desc: "Run frontend Vitest Browser Mode tests with Playwright"
    cmds:
      - task: _test:playwright:run
        vars:
          PLAYWRIGHT_CMD: pnpm exec vitest run --config vitest.browser.config.ts

  test:playwright-e2e:
    desc: "Run Playwright E2E tests"
    cmds:
      - task: _test:playwright:run
        vars:
          PLAYWRIGHT_CMD: pnpm exec playwright test

  test:playwright-headless:
    desc: "Run frontend Vitest Browser Mode tests with Playwright headless"
    cmds:
      - task: _test:playwright:run
        vars:
          PLAYWRIGHT_CMD: pnpm exec vitest run --browser.headless --reporter=verbose

  test:race:
    desc: "Run Go race tests for project packages"
    deps:
      - build:frontend:dist
    cmds:
      - task: _go:packages
        vars:
          MODE: race
          EMPTY_MESSAGE: "No Go packages found to test."
          CGO_ENABLED: "1"

  test:smoke:
    desc: "Run production smoke test"
    cmds:
      - bash scripts/smoke_test.sh

  test:frontend:
    desc: "Run frontend tests"
    dir: frontend
    cmds:
      - pnpm run test

  # ================================================
  # CI
  # ================================================

  ci:
    desc: "Run CI quality then build"
    cmds:
      - task ci:quality
      - task ci:build

  ci:build:
    desc: "Run CI build suite"
    cmds:
      - task build:backend
      - task build:tarball

  ci:desktop:
    desc: "Run desktop build"
    cmds:
      - task build

  ci:quality:
    desc: "Run CI quality gates without producing release artifacts"
    deps:
      - lint
      - test

  # ================================================
  # Cleanup
  # ================================================

  clean:
    desc: "Remove generated artifacts"
    cmds:
      - rm -rf {{.CLEAN_PATHS}}

root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_ENABLED=0 go build -ldflags \"-s -w\" -o tmp/fyom ./cmd/fyom"
  bin = "tmp/fyom"
  delay = 1500
  include_ext = ["go", "yaml", "sql", "mod", "sum"]
  exclude_dir = ["web/src", "web/node_modules", "tmp", "build", "data"]
  include_dir = ["web/dist"]
  log = "air-build-errors.log"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
